<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hero Cover</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500;700&amp;family=Montserrat:wght@300;400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Noto Serif KR', serif;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #1a1a1a;
            overflow: hidden;
        }
        /* Hero Background Image */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('hero_bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }
        /* Elegant Overlay */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(26, 26, 26, 0.85) 0%,
                rgba(20, 20, 20, 0.75) 50%,
                rgba(26, 26, 26, 0.85) 100%
            );
            z-index: 1;
        }
        /* Subtle vignette effect */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.6) 100%);
            z-index: 2;
        }
        .gold-accent-corner {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            border-top: 2px solid #c9a962;
            border-left: 2px solid #c9a962;
            opacity: 0.5;
        }
        .gold-accent-corner-bottom {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 100px;
            height: 100px;
            border-bottom: 2px solid #c9a962;
            border-right: 2px solid #c9a962;
            opacity: 0.5;
        }
        
        /* Content Styling */
        .content-wrapper {
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 900px;
            position: relative;
        }
        .quote-icon {
            font-size: 3rem;
            color: #c9a962; /* Champagne Gold */
            margin-bottom: 2rem;
            opacity: 0.8;
        }
        .main-copy {
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: -0.02em;
            margin-bottom: 3rem;
            text-shadow:
                0 2px 10px rgba(0, 0, 0, 0.8),
                0 4px 20px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(0, 0, 0, 0.4);
        }
        .main-copy .line {
            display: block;
            white-space: nowrap;
        }
        .main-copy span {
            color: #ffffff;
        }
        .divider {
            width: 80px;
            height: 3px;
            background-color: #c9a962;
            margin-bottom: 2.5rem;
        }
        .sub-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            color: #c9a962;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-weight: 400;
            opacity: 0.9;
        }
        
        /* Subtle glow effect for gold elements */
        .glow-gold {
            text-shadow: 0 0 15px rgba(201, 169, 98, 0.3);
        }

        /* Emphasis Styles */
        .text-with-icon {
            position: relative;
            display: inline-block;
        }

        .cold-text {
            color: #74b9ff;
            font-weight: 300;
            font-style: italic;
            text-shadow: 0 0 20px rgba(116, 185, 255, 0.4), 0 2px 8px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.05em;
            position: relative;
        }

        .mic-icon {
            position: absolute;
            left: 50%;
            top: -25px;
            transform: translateX(-50%);
            font-size: 1.4rem;
            color: #74b9ff;
            opacity: 0.25;
        }

        .warm-text {
            color: #ffaa5a;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 170, 90, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.02em;
            position: relative;
        }

        .heart-icon {
            position: absolute;
            left: 50%;
            top: -25px;
            transform: translateX(-50%);
            font-size: 1.3rem;
            color: #ffaa5a;
            opacity: 0.3;
            animation: heartbeat 2s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.3; }
            50% { transform: translateX(-50%) scale(1.15); opacity: 0.4; }
        }
    </style>
</head>
<body>
<div class="slide-container">
<!-- Background Image -->
<div class="bg-image"></div>
<!-- Overlay -->
<div class="bg-overlay"></div>
<!-- Vignette Effect -->
<div class="vignette"></div>
<!-- Corner Accents -->
<div class="gold-accent-corner"></div>
<div class="gold-accent-corner-bottom"></div>
<!-- Main Content -->
<div class="content-wrapper">
<div class="quote-icon">
<i class="fas fa-quote-left"></i>
</div>
<div class="main-copy">
<p>
<span class="line">"<span class="text-with-icon"><span class="cold-text">차가운 마이크<i class="fas fa-microphone-alt mic-icon"></i></span></span>에 <span class="text-with-icon"><i class="fas fa-heart heart-icon"></i><span class="warm-text">진심의 온기</span></span>를,</span>
<span class="line">브랜드의 언어에</span>
<span class="line">전략적 가치를 더합니다."</span>
</p>
</div>
<div class="divider"></div>
<div class="sub-text">
<p>Professional Communication Solution</p>
</div>
</div>
</div>
</body>
</html>
