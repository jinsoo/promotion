<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Showcase Portfolio</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&amp;family=Noto+Sans+KR:wght@300;400;500;700&amp;family=Montserrat:wght@300;400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Noto Sans KR', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        
        .slide-container {
            width: 1280px;
            height: 720px;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #1a1a1a; /* Deep Black */
            padding: 60px 80px;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
        }

        /* Decorative Background */
        .bg-circle-large {
            position: absolute;
            width: 800px;
            height: 800px;
            border: 1px solid rgba(201, 169, 98, 0.05);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .bg-circle-small {
            position: absolute;
            width: 600px;
            height: 600px;
            border: 1px solid rgba(201, 169, 98, 0.1);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .vertical-line {
            position: absolute;
            height: 100%;
            width: 1px;
            background-color: rgba(255, 255, 255, 0.03);
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
        }

        /* Content Wrapper */
        .content-wrapper {
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Header Area */
        .label-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            letter-spacing: 0.5em;
            color: #c9a962; /* Champagne Gold */
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .label-text::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background-color: #c9a962;
        }

        .main-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 56px;
            font-weight: 700;
            color: #ffffff;
            margin: 30px 0 10px 0;
            line-height: 1.2;
        }

        .sub-impact-text {
            font-family: 'Montserrat', sans-serif; /* or Noto Serif English */
            font-size: 80px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            text-transform: uppercase;
            letter-spacing: -0.02em;
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: -1;
            white-space: nowrap;
        }
        
        .sub-title-gold {
            font-family: 'La Belle Aurore', cursive; /* or Serif Italic */
            font-family: 'Noto Serif KR', serif;
            font-style: italic;
            font-size: 32px;
            color: #c9a962;
            margin-bottom: 50px;
            font-weight: 300;
        }

        /* Tags Area */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 900px;
            margin-bottom: 60px;
        }

        .portfolio-tag {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            padding: 12px 25px;
            font-size: 18px;
            font-weight: 400;
            border-radius: 50px; /* Pill shape */
            transition: all 0.3s ease;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .portfolio-tag:hover {
            border-color: #c9a962;
            background-color: rgba(201, 169, 98, 0.1);
            color: #c9a962;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .tag-icon {
            font-size: 14px;
            opacity: 0.7;
        }

        /* Footer Highlight */
        .highlight-box {
            background-color: #242424;
            border-left: 5px solid #c9a962;
            padding: 25px 50px;
            display: flex;
            align-items: center;
            gap: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 1000px;
            width: 100%;
            justify-content: space-between;
        }

        .highlight-text-wrapper {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .highlight-label {
            font-size: 14px;
            color: #c9a962;
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .highlight-content {
            font-family: 'Noto Serif KR', serif;
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
        }

        .reference-icons {
            display: flex;
            gap: 25px;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.3);
        }
        
        .ref-icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .ref-icon-text {
            font-size: 10px;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
        }

    </style>
</head>
<body>
<div class="slide-container">
<!-- Background Elements -->
<div class="vertical-line"></div>
<div class="bg-circle-large"></div>
<div class="bg-circle-small"></div>
<div class="sub-impact-text">Professional Performance</div>
<!-- Content -->
<div class="content-wrapper">
<div class="label-text">PORTFOLIO</div>
<h1 class="main-title">Y 커뮤니케이션의 현장</h1>
<p class="sub-title-gold">"Professional Performance"</p>
<div class="tags-container">
<div class="portfolio-tag">
<i class="fas fa-microphone-alt tag-icon"></i>
<span>공식행사 MC</span>
</div>
<div class="portfolio-tag">
<i class="fas fa-tv tag-icon"></i>
<span>쇼호스트</span>
</div>
<div class="portfolio-tag">
<i class="fas fa-chalkboard-user tag-icon"></i>
<span>기업교육</span>
</div>
<div class="portfolio-tag">
<i class="fas fa-briefcase tag-icon"></i>
<span>입찰 PT</span>
</div>
<div class="portfolio-tag">
<i class="fas fa-globe tag-icon"></i>
<span>국제회의</span>
</div>
<div class="portfolio-tag">
<i class="fas fa-rocket tag-icon"></i>
<span>런칭쇼</span>
</div>
<div class="portfolio-tag">
<i class="fas fa-award tag-icon"></i>
<span>시상식</span>
</div>
</div>
<div class="highlight-box">
<div class="highlight-text-wrapper">
<span class="highlight-label">Key References</span>
<p class="highlight-content">국방부, 서울시, 대기업 등 다수 프로젝트 진행</p>
</div>
<div class="reference-icons">
<div class="ref-icon-item">
<i class="fas fa-building-columns"></i>
<span class="ref-icon-text">Gov</span>
</div>
<div class="ref-icon-item">
<i class="fas fa-building"></i>
<span class="ref-icon-text">Corp</span>
</div>
<div class="ref-icon-item">
<i class="fas fa-handshake"></i>
<span class="ref-icon-text">Partner</span>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
