<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contact CTA</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&amp;family=Noto+Sans+KR:wght@300;400;500;700&amp;family=Montserrat:wght@300;400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Noto Sans KR', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        
        .slide-container {
            width: 1280px;
            height: 720px;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #1a1a1a; /* Deep Black */
            padding: 80px 100px;
            box-sizing: border-box;
            justify-content: center;
        }

        /* Decorative Elements */
        .bg-line-gold {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 120px;
            background-color: #c9a962;
            opacity: 0.7;
        }

        .bg-circle-left {
            position: absolute;
            bottom: -200px;
            left: -200px;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }
        
        .bg-circle-right {
            position: absolute;
            top: -200px;
            right: -200px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background-color: rgba(201, 169, 98, 0.03);
            pointer-events: none;
        }

        /* Header Section */
        .header-section {
            text-align: center;
            margin-bottom: 70px;
            position: relative;
            z-index: 10;
        }

        .label-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            letter-spacing: 0.4em;
            color: #c9a962; /* Champagne Gold */
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 25px;
            display: inline-block;
            padding: 0 15px;
            background-color: #1a1a1a; /* Mask line behind */
            position: relative;
            z-index: 2;
        }

        .main-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 52px;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 25px 0;
            line-height: 1.2;
        }

        .sub-message {
            font-size: 18px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Contact Cards Container */
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            width: 100%;
            z-index: 10;
        }

        /* Individual Card */
        .contact-card {
            background-color: #242424;
            width: 300px;
            height: 240px; /* Fixed height for consistency */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .contact-card:hover {
            transform: translateY(-10px);
            border-color: #c9a962;
            background-color: #2a2a2a;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .contact-card:hover .icon-wrapper {
            background-color: #c9a962;
            color: #1a1a1a;
            transform: scale(1.1);
        }

        /* Card Content */
        .icon-wrapper {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 1px solid #c9a962;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            color: #c9a962;
            font-size: 24px;
            transition: all 0.3s ease;
        }

        .card-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        .card-value {
            font-family: 'Noto Sans KR', sans-serif; /* Using Sans for readability of numbers/emails */
            font-size: 18px;
            font-weight: 500;
            color: #ffffff;
            text-align: center;
        }
        
        .card-value.website {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        /* Decorative Corner accents on cards */
        .corner-accent {
            position: absolute;
            width: 10px;
            height: 10px;
            border: 1px solid #c9a962;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .contact-card:hover .corner-accent {
            opacity: 1;
        }

        .top-left { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .top-right { top: 10px; right: 10px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 10px; left: 10px; border-right: none; border-top: none; }
        .bottom-right { bottom: 10px; right: 10px; border-left: none; border-top: none; }

        /* Bottom Message */
        .bottom-text {
            text-align: center;
            margin-top: 50px;
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            font-family: 'Montserrat', sans-serif;
        }

    </style>
</head>
<body>
<div class="slide-container">
<!-- Decorative Background -->
<div class="bg-line-gold"></div>
<div class="bg-circle-left"></div>
<div class="bg-circle-right"></div>
<!-- Header -->
<div class="header-section">
<span class="label-text">CONTACT US</span>
<h1 class="main-title">함께 시작하세요</h1>
<div class="sub-message">
<p>함께 성장할 준비가 되셨나요?<br/>새로운 프로젝트에 대해 이야기 나누는 것을 좋아합니다.</p>
</div>
</div>
<!-- Cards Grid -->
<div class="cards-container">
<!-- Phone Card -->
<div class="contact-card">
<div class="corner-accent top-left"></div>
<div class="corner-accent top-right"></div>
<div class="corner-accent bottom-left"></div>
<div class="corner-accent bottom-right"></div>
<div class="icon-wrapper">
<i class="fas fa-phone-alt"></i>
</div>
<span class="card-label">Phone</span>
<p class="card-value">010-7652-6842</p>
</div>
<!-- Email Card -->
<div class="contact-card">
<div class="corner-accent top-left"></div>
<div class="corner-accent top-right"></div>
<div class="corner-accent bottom-left"></div>
<div class="corner-accent bottom-right"></div>
<div class="icon-wrapper">
<i class="fas fa-envelope"></i>
</div>
<span class="card-label">Email</span>
<p class="card-value">info@ycom.live</p>
</div>
<!-- Website Card -->
<div class="contact-card">
<div class="corner-accent top-left"></div>
<div class="corner-accent top-right"></div>
<div class="corner-accent bottom-left"></div>
<div class="corner-accent bottom-right"></div>
<div class="icon-wrapper">
<i class="fas fa-globe"></i>
</div>
<span class="card-label">Website</span>
<p class="card-value website">ycom.live</p>
</div>
</div>
<!-- Simple Bottom Text -->
<div class="bottom-text">
<p>Let's make something great together</p>
</div>
</div>
</body>
</html>
