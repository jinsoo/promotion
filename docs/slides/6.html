<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Key Team Highlights</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #1a1a1a;
        font-family: 'Noto Sans KR', sans-serif;
        color: #ffffff;
        overflow: hidden;
    }

    .slide-container {
        width: 1280px;
        height: 720px;
        display: flex;
        flex-direction: column;
        position: relative;
        background-color: #1a1a1a;
        padding: 60px 80px;
        box-sizing: border-box;
    }

    /* Header Section */
    .header-section {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 45px;
        position: relative;
    }

    .header-left {
        display: flex;
        flex-direction: column;
    }

    .label-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 14px;
        letter-spacing: 0.3em;
        color: #c9a962;
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 10px;
    }

    .main-title {
        font-family: 'Noto Serif KR', serif;
        font-size: 42px;
        font-weight: 700;
        color: #ffffff;
        margin: 0;
        line-height: 1.2;
    }

    .header-right {
        text-align: right;
    }

    .subtitle {
        font-family: 'Noto Serif KR', serif;
        font-size: 18px;
        color: rgba(255, 255, 255, 0.6);
        font-style: italic;
    }

    /* Team Grid */
    .team-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 25px;
        flex: 1;
    }

    .team-card {
        background-color: #242424;
        border-top: 3px solid #c9a962;
        padding: 30px 25px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        position: relative;
        transition: all 0.3s ease;
        height: 100%;
    }

    .team-card:hover {
        transform: translateY(-8px);
        background-color: #2a2a2a;
        box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }

    .avatar-wrapper {
        position: relative;
        width: 120px;
        height: 120px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .avatar-placeholder {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        overflow: hidden;
        position: relative;
        border: 2px solid rgba(201, 169, 98, 0.3);
    }

    .avatar-placeholder img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
    }

    .avatar-badge {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 36px;
        height: 36px;
        background-color: #c9a962;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #1a1a1a;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        border: 2px solid #242424;
        z-index: 10;
    }

    .member-name {
        font-family: 'Noto Serif KR', serif;
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 8px;
    }

    .member-affiliation {
        font-size: 13px;
        color: #c9a962;
        margin-bottom: 15px;
        font-weight: 500;
    }

    .member-specialty {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.5;
        word-break: keep-all;
        margin-bottom: 15px;
    }

    .member-tags {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        margin-top: auto;
    }

    .tag {
        font-size: 11px;
        background-color: rgba(255, 255, 255, 0.05);
        padding: 4px 10px;
        border-radius: 4px;
        color: rgba(255, 255, 255, 0.6);
    }

    /* Bottom Note */
    .bottom-note {
        margin-top: 30px;
        padding: 15px 25px;
        background-color: rgba(45, 52, 54, 0.5);
        border-left: 4px solid #c9a962;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .note-text {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.8);
    }

    .note-highlight {
        color: #c9a962;
        font-weight: 600;
    }

    .note-icon {
        font-size: 20px;
        color: #c9a962;
    }

    /* Decorative Elements */
    .bg-deco-circle {
        position: absolute;
        top: -100px;
        right: -100px;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        border: 1px solid rgba(201, 169, 98, 0.05);
        pointer-events: none;
    }

    .accent-line {
        position: absolute;
        top: 0;
        right: 80px;
        width: 2px;
        height: 100px;
        background-color: #c9a962;
        opacity: 0.4;
    }
</style>
</head>
<body>
<div class="slide-container">
    <div class="bg-deco-circle"></div>
    <div class="accent-line"></div>

    <!-- Header -->
    <div class="header-section">
        <div class="header-left">
            <div class="label-text">Core Team</div>
            <h1 class="main-title">Y 커뮤니케이션 대표 인력</h1>
        </div>
        <div class="header-right">
            <p class="subtitle">검증된 실력의 전문가 그룹</p>
        </div>
    </div>

    <!-- Team Grid -->
    <div class="team-grid">
        <!-- Member 1: 이서진 -->
        <div class="team-card">
            <div class="avatar-wrapper">
                <div class="avatar-placeholder">
                    <img src="이서진.png" alt="이서진"/>
                </div>
                <div class="avatar-badge">
                    <i class="fas fa-microphone"></i>
                </div>
            </div>
            <h3 class="member-name">이서진</h3>
            <p class="member-affiliation">TBC 대구방송 아나운서</p>
            <p class="member-specialty">라이브커머스 7년차<br/>콜로소 교수</p>
            <div class="member-tags">
                <span class="tag">쇼호스트</span>
                <span class="tag">교수</span>
            </div>
        </div>

        <!-- Member 2: 박새하 -->
        <div class="team-card">
            <div class="avatar-wrapper">
                <div class="avatar-placeholder">
                    <img src="박새하.png" alt="박새하"/>
                </div>
                <div class="avatar-badge">
                    <i class="fas fa-tv"></i>
                </div>
            </div>
            <h3 class="member-name">박새하</h3>
            <p class="member-affiliation">MBC 아나운서</p>
            <p class="member-specialty">생방송 오늘아침 진행<br/>정부기관 프로그램 다수</p>
            <div class="member-tags">
                <span class="tag">아나운서</span>
                <span class="tag">교수</span>
            </div>
        </div>

        <!-- Member 3: 송혜지 -->
        <div class="team-card">
            <div class="avatar-wrapper">
                <div class="avatar-placeholder">
                    <img src="송혜지.png" alt="송혜지"/>
                </div>
                <div class="avatar-badge">
                    <i class="fas fa-cloud-sun"></i>
                </div>
            </div>
            <h3 class="member-name">송혜지</h3>
            <p class="member-affiliation">MBC경남 기상캐스터</p>
            <p class="member-specialty">삼성전자 SEDEX 진행<br/>대형 기업 행사 전문</p>
            <div class="member-tags">
                <span class="tag">기상캐스터</span>
                <span class="tag">MC</span>
            </div>
        </div>

        <!-- Member 4: 권소아 -->
        <div class="team-card">
            <div class="avatar-wrapper">
                <div class="avatar-placeholder">
                    <img src="권소아.png" alt="권소아"/>
                </div>
                <div class="avatar-badge">
                    <i class="fas fa-globe"></i>
                </div>
            </div>
            <h3 class="member-name">권소아</h3>
            <p class="member-affiliation">아리랑국제방송 앵커</p>
            <p class="member-specialty">한영독불 4개국어<br/>tvN 유퀴즈 출연</p>
            <div class="member-tags">
                <span class="tag">앵커</span>
                <span class="tag">4개국어</span>
            </div>
        </div>
    </div>

    <!-- Bottom Note -->
    <div class="bottom-note">
        <span class="note-text">
            검증된 방송 실전 경력의 최정상급 전문 인력 다수 보유
        </span>
        <i class="fas fa-users note-icon"></i>
    </div>
</div>
</body>
</html>
