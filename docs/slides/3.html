<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Logos Grid Triple</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&amp;family=Noto+Sans+KR:wght@300;400;500;700&amp;family=Montserrat:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Noto Serif KR', serif;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #1a1a1a; /* Deep Black */
            padding: 60px 80px;
            box-sizing: border-box;
        }

        /* Header Styles */
        .header-section {
            display: flex;
            flex-direction: column;
            margin-bottom: 50px;
            position: relative;
        }
        
        .label-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            letter-spacing: 0.2em;
            color: #c9a962; /* Champagne Gold */
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .title-container {
            display: flex;
            align-items: baseline;
            gap: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .main-title {
            font-size: 42px;
            font-weight: 700;
            margin: 0;
            line-height: 1.2;
        }

        .sub-quote {
            font-family: 'Noto Serif KR', serif;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
            font-weight: 300;
        }

        /* Content Grid */
        .partners-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            height: 100%;
        }

        .partner-card {
            background-color: #242424; /* Slightly lighter than bg */
            border-top: 3px solid #c9a962;
            padding: 30px;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .category-icon {
            font-size: 24px;
            color: #c9a962;
            margin-right: 15px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(201, 169, 98, 0.1);
            border-radius: 50%;
        }

        .category-title {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin: 0;
        }

        .logo-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .partner-item {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 16px;
            color: #e0e0e0;
            padding: 12px 16px;
            background-color: rgba(255, 255, 255, 0.03);
            border-left: 2px solid rgba(201, 169, 98, 0.3);
            display: flex;
            align-items: center;
        }

        .partner-item:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.015);
        }

        .partner-name {
            font-weight: 400;
            letter-spacing: -0.01em;
        }

        /* Decorative background elements */
        .bg-deco-line {
            position: absolute;
            right: 0;
            top: 60px;
            width: 200px;
            height: 1px;
            background-color: #c9a962;
            opacity: 0.3;
        }
    </style>
</head>
<body>
<div class="slide-container">
<!-- Header Section -->
<div class="header-section">
<div class="label-text">CLIENTS &amp; PARTNERS</div>
<div class="title-container">
<h1 class="main-title">협업 파트너사</h1>
<p class="sub-quote">"신뢰와 실력으로 함께하는 동반자들"</p>
</div>
<div class="bg-deco-line"></div>
</div>
<!-- Partners Grid -->
<div class="partners-grid">
<!-- Column 1: Public -->
<div class="partner-card">
<div class="card-header">
<div class="category-icon">
<i class="fas fa-landmark"></i>
</div>
<h2 class="category-title">공공 / 지방자치</h2>
</div>
<div class="logo-list">
<div class="partner-item"><span class="partner-name">지방자치인재개발원</span></div>
<div class="partner-item"><span class="partner-name">서울특별시청</span></div>
<div class="partner-item"><span class="partner-name">경기도청</span></div>
<div class="partner-item"><span class="partner-name">강원도특별자치도교육청</span></div>
</div>
</div>
<!-- Column 2: Corporate -->
<div class="partner-card">
<div class="card-header">
<div class="category-icon">
<i class="fas fa-building"></i>
</div>
<h2 class="category-title">기업 / 브랜드</h2>
</div>
<div class="logo-list">
<div class="partner-item"><span class="partner-name">SAMSUNG</span></div>
<div class="partner-item"><span class="partner-name">LG전자</span></div>
<div class="partner-item"><span class="partner-name">현대백화점 / Market Kurly</span></div>
<div class="partner-item"><span class="partner-name">교보생명 / 애터미</span></div>
<div class="partner-item"><span class="partner-name">Coway</span></div>
</div>
</div>
<!-- Column 3: Global/IT -->
<div class="partner-card">
<div class="card-header">
<div class="category-icon">
<i class="fas fa-globe"></i>
</div>
<h2 class="category-title">글로벌 / IT</h2>
</div>
<div class="logo-list">
<div class="partner-item"><span class="partner-name">Microsoft Research Asia</span></div>
<div class="partner-item"><span class="partner-name">HP (Hewlett-Packard)</span></div>
<div class="partner-item"><span class="partner-name">Symantec</span></div>
<div class="partner-item"><span class="partner-name">FireEye</span></div>
</div>
</div>
</div>
</div>
</body>
</html>
