<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Closing Slide</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&amp;family=Noto+Sans+KR:wght@300;400;500;700&amp;family=Montserrat:wght@300;400;500;600;700;900&amp;family=La+Belle+Aurore&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Noto Sans KR', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        
        .slide-container {
            width: 1280px;
            height: 720px;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #1a1a1a; /* Deep Black */
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Decorative Background */
        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background-color: rgba(201, 169, 98, 0.03); /* Subtle Gold Glow */
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
        }

        .bg-circle-outline {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            border: 1px solid rgba(201, 169, 98, 0.05);
            border-radius: 50%;
            z-index: 0;
        }

        /* Main Content */
        .content-wrapper {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        .logo-symbol {
            font-size: 40px;
            color: #c9a962;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .company-name {
            font-family: 'Noto Serif KR', serif;
            font-size: 64px;
            font-weight: 700;
            color: #c9a962; /* Champagne Gold */
            margin: 0 0 30px 0;
            line-height: 1.2;
            letter-spacing: -0.02em;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .divider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 40px;
        }

        .divider-line {
            width: 80px;
            height: 3px;
            background-color: #ffffff;
            opacity: 0.2;
        }
        
        .divider-diamond {
            width: 8px;
            height: 8px;
            background-color: #c9a962;
            transform: rotate(45deg);
            margin: 0 15px;
        }

        .core-message {
            font-family: 'Noto Serif KR', serif;
            font-size: 28px;
            font-weight: 300;
            color: #ffffff;
            margin: 0;
            opacity: 0.9;
        }

        .english-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            margin-top: 15px;
        }

        /* Footer */
        .footer-bar {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .copyright {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.05em;
        }

        .designed-by {
            font-family: 'La Belle Aurore', cursive;
            font-size: 14px;
            color: rgba(201, 169, 98, 0.4);
            margin-top: 5px;
        }

    </style>
</head>
<body>
<div class="slide-container">
<!-- Background Elements -->
<div class="bg-glow"></div>
<div class="bg-circle-outline"></div>
<!-- Main Content -->
<div class="content-wrapper">
<div class="logo-symbol">
<i class="fas fa-quote-left"></i>
</div>
<h1 class="company-name">와이 커뮤니케이션</h1>
<div class="divider-container">
<div class="divider-line"></div>
<div class="divider-diamond"></div>
<div class="divider-line"></div>
</div>
<p class="core-message">조직의 DNA를 분석하고, 비즈니스의 격을 설계합니다.</p>
<p class="english-subtitle">Professional Communication Solution</p>
</div>
<!-- Footer -->
<div class="footer-bar">
<p class="copyright">© 2026 Y Communication. All rights reserved.</p>
<p class="designed-by">Designed for high impact.</p>
</div>
</div>
</body>
</html>
