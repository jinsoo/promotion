<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Title Statement</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&amp;family=Noto+Sans+KR:wght@300;400;500;700&amp;family=Montserrat:wght@300;400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Noto Serif KR', serif;
            color: #ffffff;
            overflow: hidden;
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #1a1a1a;
        }
        
        /* Decorative Borders */
        .border-frame {
            position: absolute;
            top: 30px;
            left: 30px;
            right: 30px;
            bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 1;
        }

        .gold-accent-top {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 80px;
            background-color: #c9a962;
            z-index: 2;
        }

        /* Typography */
        .main-headline {
            font-size: 3.5rem; /* 56px */
            font-weight: 700;
            line-height: 1.3;
            text-align: center;
            margin-bottom: 3rem;
            z-index: 10;
            letter-spacing: -0.03em;
        }
        
        .main-headline .highlight {
            color: #c9a962;
            display: inline-block;
            position: relative;
        }

        .sub-description {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 1.25rem; /* 20px */
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-bottom: 4rem;
            line-height: 1.6;
            font-weight: 300;
            letter-spacing: -0.01em;
            max-width: 800px;
            z-index: 10;
        }

        .company-name-container {
            position: relative;
            z-index: 10;
            padding-top: 2rem;
            border-top: 1px solid rgba(201, 169, 98, 0.3);
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
        }

        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem; /* 40px */
            font-weight: 600;
            color: #c9a962;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        
        /* Background decorative circle (Solid color implementation to avoid gradients) */
        .bg-circle {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background-color: #222; /* Slightly lighter than bg */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            opacity: 0.5;
        }
    </style>
</head>
<body>
<div class="slide-container">
<!-- Background Elements -->
<div class="border-frame"></div>
<div class="bg-circle"></div>
<div class="gold-accent-top"></div>
<!-- Main Content -->
<div class="main-headline">
<p>조직의 DNA를 분석하고,<br/>
<span class="highlight">비즈니스의 격</span>을 설계합니다.</p>
</div>
<div class="sub-description">
<p>대한민국 최고의 스피치·미디어 컨설팅,<br/>
            전문 연사 섭외 및 교육 기획 전문 기업</p>
</div>
<div class="company-name-container">
<div class="company-name">
<p>Y COMMUNICATION</p>
</div>
</div>
</div>
</body>
</html>
